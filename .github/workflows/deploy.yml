name: Release & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Auto-Bump Semantic Version on Merge
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LAST_MSG=$(git log -1 --pretty=%B)
          echo "Inspecting commit message: $LAST_MSG"

          if echo "$LAST_MSG" | grep -qE "^chore\(release\):"; then
            echo "Already a release commit, skipping version bump."
            exit 0
          fi

          BUMP="patch"
          if echo "$LAST_MSG" | grep -qE "(BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:)"; then
            BUMP="major"
          elif echo "$LAST_MSG" | grep -qE "(^feat(\([^)]+\))?:|from [^/]+/feat[-/])"; then
            BUMP="minor"
          fi

          echo "Bumping version ($BUMP)..."
          npm version "$BUMP" --no-git-tag-version

          NEW_VER=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore(release): v${NEW_VER} [skip ci]"
          git tag -a "v${NEW_VER}" -m "Release v${NEW_VER}"
          git push origin HEAD:main --follow-tags

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
