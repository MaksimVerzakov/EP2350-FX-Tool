name: Release & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Compute & Tag Next Semantic Version
        id: semver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Find latest vX.Y.Z tag, or start from package.json (1.0.0)
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            BASE_VER=$(node -p "require('./package.json').version")
          else
            BASE_VER="${LATEST_TAG#v}"
          fi
          echo "Base version: $BASE_VER"

          if [ "${{ github.event_name }}" = "push" ]; then
            LAST_MSG=$(git log -1 --pretty=%B)
            echo "Inspecting merged commit: $LAST_MSG"

            BUMP="patch"
            if echo "$LAST_MSG" | grep -qE "(BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:)"; then
              BUMP="major"
            elif echo "$LAST_MSG" | grep -qE "(^feat(\([^)]+\))?:|from [^/]+/feat[-/])"; then
              BUMP="minor"
            fi

            npm version "$BASE_VER" --no-git-tag-version --allow-same-version
            npm version "$BUMP" --no-git-tag-version
            NEW_VER=$(node -p "require('./package.json').version")

            git tag -a "v${NEW_VER}" -m "Release v${NEW_VER}"
            git push origin "v${NEW_VER}"
            echo "Tagged and pushed v${NEW_VER}"
          else
            NEW_VER="$BASE_VER"
          fi

          echo "APP_VERSION=${NEW_VER}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run Production Test Suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
